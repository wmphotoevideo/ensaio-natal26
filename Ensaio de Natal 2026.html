<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ensaio de Natal 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar de abas + palco central; guirlanda de luzes no topo; neve dourada ao fundo.
   Single look deliberado: marrom-café profundo, vermelho natalino e dourado. */
:root{
  --bg:#190d0a; --bg2:#22120d; --surface:#2c1912; --surface2:#3a2218; --surface3:#4a2c1f;
  --line:rgba(224,178,92,.16); --line2:rgba(224,178,92,.32);
  --ink:#f7ead8; --ink2:#cdb59b; --muted:#957c66;
  --red:#c8283a; --red2:#e24556; --red-deep:#7f1624;
  --gold:#e0b25c; --gold2:#f4d995; --gold-deep:#a97c2c; --brown:#5b3a29;
  --pine:#4aa271; --amber:#e8a23a; --danger:#ff7b7b;
  --font-d:'Fraunces',Georgia,'Times New Roman',serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;margin:0;
  background-image:radial-gradient(900px 500px at 10% -10%,rgba(200,40,58,.22),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(224,178,92,.12),transparent 55%),linear-gradient(180deg,var(--bg),#120907);
  background-attachment:fixed;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
small{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
#snow,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}#fx{z-index:90}

/* guirlanda */
.garland{position:relative;height:46px;z-index:2;pointer-events:none}
.garland svg{position:absolute;inset:0;width:100%;height:100%}
.garland path{fill:none;stroke:var(--gold-deep);stroke-width:1.5;vector-effect:non-scaling-stroke}
.bulb{position:absolute;width:11px;height:15px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;transform:translateX(-50%);animation:twinkle 2.8s ease-in-out infinite}
.bulb::before{content:"";position:absolute;left:50%;top:-4px;width:5px;height:5px;background:var(--gold-deep);transform:translateX(-50%);border-radius:1px}
.bulb.r{background:var(--red2);box-shadow:0 0 12px 2px rgba(226,69,86,.7)}
.bulb.g{background:var(--gold2);box-shadow:0 0 12px 2px rgba(244,217,149,.65)}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.45;filter:brightness(.8)}}

/* estrutura */
.app{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);gap:0;max-width:1480px;margin:0 auto}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:8px 14px 20px 20px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:6px 8px 14px;border-bottom:1px solid var(--line)}
.brand .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;gap:8px;align-items:center}
.brand .t{font-family:var(--font-d);font-style:italic;font-size:30px;line-height:1.02;background:linear-gradient(100deg,var(--gold-deep),var(--gold2) 40%,var(--gold) 60%,var(--gold-deep));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
.brand .y{font-family:var(--font-d);font-weight:700;font-size:44px;line-height:1;color:var(--red2);letter-spacing:-.03em;text-shadow:0 0 28px rgba(226,69,86,.45)}
@keyframes shimmer{to{background-position:-220% 0}}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:500;position:relative;transition:background .25s,color .25s,transform .25s}
.nav a:hover{background:rgba(224,178,92,.08);color:var(--ink);transform:translateX(3px)}
.nav a.on{background:linear-gradient(90deg,rgba(200,40,58,.34),rgba(200,40,58,.08));color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(224,178,92,.28)}
.nav a:focus-visible,.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav .bd{margin-left:auto;background:var(--gold);color:#2a1308;border-radius:99px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.i{width:20px;height:20px;flex:none}
.sidefoot{margin-top:auto;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pine);box-shadow:0 0 8px var(--pine);flex:none}
.dot.off{background:var(--amber);box-shadow:0 0 8px var(--amber)}
main{padding:14px 28px 60px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:clamp(26px,4vw,38px)}
.ph p{margin:4px 0 0;color:var(--ink2);max-width:60ch}
.phact{display:flex;gap:10px;flex-wrap:wrap}

/* controles */
.btn{border:1px solid var(--line2);background:rgba(224,178,92,.07);color:var(--gold2);padding:9px 15px;border-radius:11px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .2s,background .2s,box-shadow .2s;font-size:14px}
.btn:hover{background:rgba(224,178,92,.15);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(180deg,var(--red2),var(--red-deep));border-color:rgba(244,217,149,.5);color:#fff;box-shadow:0 6px 18px rgba(200,40,58,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.pri:hover{box-shadow:0 8px 24px rgba(226,69,86,.5),inset 0 1px 0 rgba(255,255,255,.25);background:linear-gradient(180deg,#ee5565,var(--red-deep))}
.btn.wa{background:linear-gradient(180deg,#2fae63,#1c7d45);border-color:rgba(255,255,255,.25);color:#fff}
.btn.wa:hover{background:linear-gradient(180deg,#38c070,#1c7d45)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{color:var(--danger);border-color:rgba(255,123,123,.4)}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
input,select,textarea{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,178,92,.18);outline:none}
select option{background:var(--surface);color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);padding:0}
input[type=date],input[type=time]{color-scheme:dark}
.card{background:linear-gradient(180deg,rgba(58,34,24,.82),rgba(44,25,18,.88));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);position:relative;min-width:0}
.card h2{font-size:20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2 small{font-family:var(--font-b);font-weight:500;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:#2a1308;background:var(--st,var(--gold))}
.pill.ln{background:transparent;color:var(--st,var(--ink2));box-shadow:inset 0 0 0 1px var(--st,var(--line2))}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--line2);color:var(--gold);padding:1px 7px;border-radius:6px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.empty{text-align:center;padding:34px 16px;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--font-d);font-size:20px;color:var(--ink);font-weight:600}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--font-d);font-weight:700;color:#2a1308;background:conic-gradient(from 210deg,var(--gold-deep),var(--gold2),var(--gold),var(--gold-deep));box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line2)}

/* painel */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center;overflow:hidden;background:radial-gradient(500px 240px at 90% 0%,rgba(224,178,92,.18),transparent 60%),linear-gradient(135deg,#7f1624 0%,#4d1018 55%,#3a1a12 100%);border-color:rgba(244,217,149,.35)}
.hero::after{content:"";position:absolute;inset:6px;border:1px solid rgba(244,217,149,.25);border-radius:14px;pointer-events:none}
.hero .cd{font-family:var(--font-d);font-weight:700;font-size:clamp(64px,10vw,104px);line-height:.9;color:var(--gold2);text-shadow:0 0 36px rgba(244,217,149,.35)}
.hero .cdl{font-family:var(--font-d);font-style:italic;font-size:22px;color:var(--ink)}
.hero p{margin:10px 0 0;color:#ecd3bb;max-width:46ch}
.ringbox{display:flex;align-items:center;gap:18px;justify-content:flex-end}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:rgba(0,0,0,.3)}
.ring .fg{stroke:url(#gold);stroke-dasharray:var(--c);stroke-dashoffset:var(--off);filter:drop-shadow(0 0 6px rgba(244,217,149,.5))}
.anim .ring .fg{animation:ring 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:28px;color:var(--gold2)}
.ringbox small{color:#ecd3bb;display:block;max-width:15ch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:24px}}
.kpi{padding:16px 18px;border-radius:16px;background:linear-gradient(180deg,rgba(58,34,24,.85),rgba(40,22,16,.9));border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
.kpi::before{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--k,var(--gold)) 0%,transparent 70%);opacity:.22}
.kpi .l{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.kpi .v{font-family:var(--font-d);font-size:30px;font-weight:600;margin-top:6px;color:var(--k,var(--gold2));font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.anim .kpi,.anim .card,.anim .hero{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.anim .kpi:nth-child(2){animation-delay:.05s}.anim .kpi:nth-child(3){animation-delay:.1s}.anim .kpi:nth-child(4){animation-delay:.15s}.anim .kpi:nth-child(5){animation-delay:.2s}.anim .kpi:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.bars{display:flex;gap:10px;align-items:flex-end;height:176px;overflow-x:auto;padding-bottom:4px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 0 38px}
.btrack{position:relative;width:100%;max-width:44px;height:120px;border-radius:9px;background:rgba(0,0,0,.28);border:1px solid var(--line);display:flex;align-items:flex-end;overflow:hidden}
.bfill{width:100%;background:linear-gradient(180deg,var(--gold2),var(--red));border-radius:7px 7px 0 0;transform-origin:bottom;min-height:4px}
.anim .bfill{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.bcol b{font-size:12px;color:var(--gold2)}
.bcol small{font-size:11px;white-space:nowrap}
.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:132px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13.5px}
.ftr{height:12px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.ff{height:100%;border-radius:99px;background:var(--st);transform-origin:left;min-width:0}
.anim .ff{animation:growx 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;transition:background .2s}
.li:hover{background:rgba(224,178,92,.07)}
.li+.li{border-top:1px solid var(--line)}
.li .m{min-width:0;flex:1}
.li .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* clientes */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar .field{flex:1 1 170px}
.bar .field.grow{flex:3 1 240px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(190px,1.5fr) minmax(110px,.8fr) minmax(150px,1fr) minmax(160px,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:linear-gradient(180deg,rgba(58,34,24,.78),rgba(44,25,18,.85));border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.row:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.anim .row{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.row .who{display:flex;gap:12px;align-items:center;min-width:0}
.row .who>div{min-width:0}
.row .who b,.row .who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{display:flex;flex-direction:column;gap:1px;min-width:0}
.row .tags{display:flex;gap:6px;flex-wrap:wrap}
.row .acts{display:flex;gap:6px}
.ok{color:var(--pine)}.warn{color:var(--amber)}.bad{color:var(--danger)}

/* agenda */
.agwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:18px;align-items:start}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal .hd h2{margin:0;text-transform:capitalize}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-align:center;padding-bottom:4px}
.day{min-height:92px;border-radius:12px;padding:6px;background:rgba(0,0,0,.2);border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;transition:border-color .2s,background .2s,transform .2s}
.day:hover{border-color:var(--line2);background:rgba(224,178,92,.07);transform:translateY(-1px)}
.day.out{visibility:hidden;pointer-events:none}
.day.has{background:rgba(200,40,58,.12);border-color:rgba(200,40,58,.3)}
.day.today .dn{background:var(--gold);color:#2a1308}
.day.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(224,178,92,.25)}
.dn{font-size:12.5px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.chip{font-size:11px;line-height:1.2;padding:2px 5px;border-radius:6px;background:var(--red-deep);color:#ffe9d0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--gold)}
.more{font-size:11px;color:var(--gold)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:6px 11px;border-radius:9px;border:1px solid var(--line2);background:rgba(224,178,92,.07);color:var(--gold2);cursor:pointer;font-weight:600;font-size:13px;transition:background .2s,transform .2s}
.slot:hover{background:rgba(224,178,92,.18);transform:translateY(-1px)}
.slot.taken{background:rgba(200,40,58,.2);border-color:rgba(226,69,86,.5);color:#ffb8bf}
.slot.pick{background:var(--gold);color:#2a1308;border-color:var(--gold2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;color:var(--ink2);font-weight:600}
.seg button.on{background:rgba(224,178,92,.2);color:var(--gold2)}
.dgroup h3{font-size:17px;margin:18px 0 8px;color:var(--gold2);text-transform:capitalize}
.dgroup.past{opacity:.6}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(258px,1fr);gap:14px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity}
.col{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:340px;scroll-snap-align:start;transition:background .2s,border-color .2s}
.col.over{background:rgba(224,178,92,.1);border-color:var(--gold)}
.col .ch{display:flex;align-items:center;gap:8px;padding:4px 4px 8px;border-bottom:2px solid var(--st)}
.col .ch b{font-family:var(--font-d);font-size:16px}
.col .ch small{display:block;font-size:11.5px}
.col .ch .n{margin-left:auto;background:var(--st);color:#2a1308;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:12px}
.kc{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab;transition:transform .2s,box-shadow .2s,border-color .2s}
.kc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.4);border-color:var(--line2)}
.kc.drag{opacity:.4}
.kc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kc .top b{overflow-wrap:anywhere}
/* sino de avisos e resumo do dia */
.bell{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:45;width:50px;height:50px;border-radius:50%;border:1px solid var(--gold2);background:radial-gradient(circle at 30% 22%,var(--red2),var(--red-deep) 70%);color:var(--gold2);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 26px rgba(200,40,58,.55),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .25s}
.bell:hover{transform:scale(1.08)}
.bell[hidden]{display:none}
.bell{position:absolute;width:38px;height:38px;top:calc(52px + env(safe-area-inset-top,0px));background:transparent;border:0;box-shadow:none;color:var(--gold)}
.bell:hover{transform:none;color:var(--gold2);background:rgba(224,178,92,.12)}
.bell .i{width:21px;height:21px;filter:drop-shadow(0 0 6px rgba(224,178,92,.45))}
.bell.has::after{display:none}
.bell .badge{top:0;right:-2px;min-width:17px;height:17px;font-size:10.5px;border-width:2px;background:var(--red2);color:#fff}
.bell .i{width:23px;height:23px}
.bell.has .i{animation:belljig 3.2s ease-in-out infinite;transform-origin:50% 10%}

function pendencias(){const out=[],t=todayISO(),tm=addDays(t,1);
  for(const c of S.clients){const e=c.enviados||{},i=(ET[c.etapa]||ET.agendado).i,k=calc(c);
    if(i===0&&!e.confirmacao)out.push({c,key:'confirmacao',why:'Novo cliente: enviar confirmação'});
    if(i===0&&!e.lembrete&&(c.data===tm||c.data===t))out.push({c,key:'lembrete',why:c.data===t?'Ensaio hoje':'Ensaio amanhã',hot:1});
    if((c.etapa==='realizado'||c.etapa==='selecao')&&!e.selecao)out.push({c,key:'selecao',why:'Enviar fotos para escolha',need:!c.linkSelecao&&'Falta o link da galeria'});
    if(c.etapa==='selecao'&&e.selecao&&!e.lembrete_selecao&&daysSince(e.selecao)>=3)out.push({c,key:'lembrete_selecao',why:'Sem resposta há '+Math.floor(daysSince(e.selecao))+' dias',hot:1});
    if(c.etapa==='escolhidas'&&!e.recebido)out.push({c,key:'recebido',why:'Confirmar fotos escolhidas'});
    if(c.etapa==='pronto'&&k.aReceber>0&&!e.cobranca)out.push({c,key:'cobranca',why:'Cobrar '+brl0(k.aReceber)+' antes de entregar',hot:1});
    if((c.etapa==='pronto'||c.etapa==='entregue')&&!e.entrega)out.push({c,key:'entrega',why:(k.aReceber>0)?'Restante ainda não pago':'Enviar fotos editadas',need:!c.linkFinal&&'Falta o link final'});
    if(c.etapa==='entregue'&&e.entrega&&!e.avaliacao&&daysSince(e.entrega)>=2)out.push({c,key:'avaliacao',why:'Pedir avaliação'});
  }
  return out.filter(p=>!(p.c.dispensados&&p.c.dispensados[p.key]))}

function vAgenda(){const {y,m}=S.cal,t=todayISO();const seg='<div class="seg"><button data-act="agv" data-v="cal" class="'+(S.agView==='cal'?'on':'')+'" type="button">Calendário</button><button data-act="agv" data-v="lista" class="'+(S.agView==='lista'?'on':'')+'" type="button">Lista</button></div>';
  if(S.agView==='lista'){const cs=S.clients.filter(c=>c.data).sort((a,b)=>(a.data+(a.horario||'')).localeCompare(b.data+(b.horario||'')));const groups={};cs.forEach(c=>(groups[c.data]=groups[c.data]||[]).push(c));
    return head(seg+addBtn)+(cs.length?Object.keys(groups).map(d=>'<div class="dgroup'+(d<t?' past':'')+'"><h3>'+DIASL[parseISO(d).getDay()]+', '+fmtLong(d)+(d===t?' · hoje':'')+'</h3><div class="rows">'+groups[d].map(c=>'<div class="row" data-act="edit" data-id="'+c.id+'" style="grid-template-columns:90px minmax(150px,1.4fr) minmax(130px,1fr) auto"><div class="c"><b class="num" style="font-size:20px;font-family:var(--font-d);color:var(--gold2)">'+(c.horario||'--:--')+'</b></div><div class="who"><span class="av">'+esc(initials(c.nome))+'</span><div><b>'+esc(c.nome)+'</b><small>'+esc(c.telefone)+'</small></div></div><div class="tags">'+stPill(c)+'</div><div class="acts"><button class="btn sm wa" data-act="msg" data-id="'+c.id+'" type="button">'+ico('chat')+'</button></div></div>').join('')+'</div></div>').join(''):'<div class="card empty"><b>Agenda vazia</b>Cadastre clientes com data e horário para vê-los aqui.</div>');}
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();let cells='';
  for(let i=0;i<first;i++)cells+='<div class="day out"></div>';
  for(let d=1;d<=dim;d++){const iso=y+'-'+pad(m+1)+'-'+pad(d),l=dayList(iso);cells+='<button class="day'+(l.length?' has':'')+(iso===t?' today':'')+(iso===S.cal.sel?' sel':'')+'" data-act="selday" data-d="'+iso+'" type="button"><span class="dn">'+d+'</span>'+l.slice(0,3).map(c=>'<span class="chip">'+(c.horario||'')+' '+esc(firstName(c.nome))+'</span>').join('')+(l.length>3?'<span class="more">+'+(l.length-3)+'</span>':'')+'</button>'}
  const sel=S.cal.sel,sl=dayList(sel),taken=Object.fromEntries(sl.filter(c=>c.horario).map(c=>[c.horario,c]));
  const slots=[...new Set([...S.cfg.horarios,...sl.map(c=>c.horario).filter(Boolean)])].sort();
  return head(seg+addBtn)+'<div class="agwrap"><section class="card cal"><div class="hd"><button class="btn sm" data-act="calnav" data-n="-1" type="button">'+ico('left')+'</button><h2>'+MESL[m]+' '+y+'</h2><button class="btn sm" data-act="calnav" data-n="1" type="button">'+ico('right')+'</button></div><div class="cgrid">'+['D','S','T','Q','Q','S','S'].map(x=>'<div class="dow">'+x+'</div>').join('')+cells+'</div></section>'+
  '<section class="card"><h2>'+DIASL[parseISO(sel).getDay()]+', '+fmtLong(sel)+'</h2><small>'+(sl.length?sl.length+' ensaio(s) neste dia':'Dia livre')+'</small>'+
  (sl.length?'<div class="list" style="margin:10px 0">'+sl.map(c=>'<div class="li" data-act="edit" data-id="'+c.id+'" style="cursor:pointer"><b class="num" style="font-family:var(--font-d);font-size:18px;color:var(--gold2);min-width:54px">'+(c.horario||'--:--')+'</b><div class="m"><b>'+esc(c.nome)+'</b><small>'+(ET[c.etapa]||ET.agendado).n+'</small></div><button class="btn sm wa" data-act="msg" data-id="'+c.id+'" type="button">'+ico('chat')+'</button></div>').join('')+'</div>':'')+
  '<div class="sec"><span class="lbl">Horários · toque num livre para agendar</span><div class="slots">'+slots.map(h=>taken[h]?'<span class="slot taken" title="'+esc(taken[h].nome)+'">'+h+' · '+esc(firstName(taken[h].nome))+'</span>':'<button class="slot" data-act="newslot" data-d="'+sel+'" data-h="'+h+'" type="button">'+h+'</button>').join('')+'</div></div></section></div>'}

/* ---- pós-produção ---- */
function vPos(){const t=todayISO();
  return head('<button class="btn" data-act="new" type="button">'+ico('plus')+'Novo cliente</button>')+'<div class="board" id="board">'+ETAPAS.map(e=>{const l=S.clients.filter(c=>(c.etapa||'agendado')===e.k).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    return '<div class="col" data-etapa="'+e.k+'" style="--st:'+e.c+'"><div class="ch"><div><b>'+e.n+'</b><small>'+e.s+'</small></div><span class="n">'+l.length+'</span></div>'+
    l.map(c=>{const done=CHECK.filter((_,i)=>c.check&&c.check[i]).length,dl=c.data?addDays(c.data,S.cfg.prazo):'',late=dl&&dl<t&&c.etapa!=='entregue',k=calc(c),op=S.open[c.id],i=ET[c.etapa].i;
      return '<div class="kc" draggable="true" data-id="'+c.id+'"><div class="top"><b>'+esc(c.nome)+'</b>'+(k.ex?'<span class="pill" style="--st:var(--amber)">+'+k.ex+' extra'+(k.ex>1?'s':'')+'</span>':'')+'</div>'+
      '<small>Ensaio '+fmtDay(c.data)+(dl&&c.etapa!=='entregue'?' · entrega até '+pad(parseISO(dl).getDate())+'/'+pad(parseISO(dl).getMonth()+1):'')+'</small>'+(late?'<small class="bad">Prazo de entrega vencido</small>':'')+
      (k.aReceber>0&&i>=ET.pronto.i?'<small class="warn">Restante: '+brl0(k.aReceber)+'</small>':'')+
      '<div class="exrow"><small>Fotos extras</small><div class="step"><button type="button" data-act="exq" data-id="'+c.id+'" data-n="-1" aria-label="Menos uma foto extra">−</button><b class="num">'+k.ex+'</b><button type="button" data-act="exq" data-id="'+c.id+'" data-n="1" aria-label="Mais uma foto extra">+</button></div><small class="num">'+brl0(k.extrasV)+'</small></div>'+
      '<div class="prog" title="'+done+' de '+CHECK.length+'"><i style="width:'+done/CHECK.length*100+'%"></i></div>'+
      '<button class="btn sm ghost" data-act="tgchk" data-id="'+c.id+'" type="button" style="justify-content:space-between">Checklist '+done+'/'+CHECK.length+ico('down')+'</button>'+
      (op?'<div class="chk">'+CHECK.map((x,j)=>'<label><input type="checkbox" data-act="chk" data-id="'+c.id+'" data-i="'+j+'"'+(c.check&&c.check[j]?' checked':'')+'>'+x+'</label>').join('')+'</div>':'')+
      '<div class="kact"><div class="g"><button class="btn sm" data-act="mv" data-id="'+c.id+'" data-n="-1" type="button" '+(i===0?'disabled':'')+' title="Etapa anterior">'+ico('left')+'</button><button class="btn sm pri" data-act="mv" data-id="'+c.id+'" data-n="1" type="button" '+(i===ETAPAS.length-1?'disabled':'')+' title="Avançar etapa">'+ico('right')+'</button></div><div class="g"><button class="btn sm wa" data-act="msg" data-id="'+c.id+'" type="button">'+ico('chat')+'</button><button class="btn sm" data-act="edit" data-id="'+c.id+'" type="button">'+ico('edit')+'</button></div></div></div>'}).join('')+(l.length?'':'<small style="text-align:center;padding:16px 4px;color:var(--muted)">Arraste um cliente para cá</small>')+'</div>'}).join('')+'</div>'}

/* ---- whatsapp ---- */
function vWhats(){const p=pendencias(),hist=[];S.clients.forEach(c=>Object.entries(c.enviados||{}).forEach(([k,ms])=>hist.push({c,k,ms})));hist.sort((a,b)=>b.ms-a.ms);
  return head('<button class="btn wa" data-act="msg" data-id="" type="button">'+ico('chat')+'Nova mensagem</button><a class="btn" href="#configuracoes">Editar modelos</a>')+
  '<div class="grid g2"><section class="card"><h2>Fila automática <small>'+p.length+' pendente'+(p.length===1?'':'s')+'</small></h2>'+(p.length?'<div class="list">'+p.map(x=>'<div class="li"><span class="av">'+esc(initials(x.c.nome))+'</span><div class="m"><b>'+esc(x.c.nome)+'</b><small>'+MSGS.find(m=>m.k===x.key).n+' · '+esc(x.why)+'</small>'+(x.need?'<small class="warn">'+x.need+'</small>':'')+'</div><button class="btn sm wa" data-act="msg" data-id="'+x.c.id+'" data-key="'+x.key+'" type="button">Enviar</button><button class="btn sm danger" data-act="dismiss" data-id="'+x.c.id+'" data-key="'+x.key+'" type="button" title="Excluir este lembrete">Excluir</button></div>').join('')+'</div>':'<div class="empty"><b>Fila vazia</b>As mensagens aparecem aqui sozinhas conforme cada cliente avança nas etapas.</div>')+'</section>'+
  '<section class="card"><h2>Enviadas recentemente</h2>'+(hist.length?'<div class="list">'+hist.slice(0,10).map(h=>'<div class="li"><div class="m"><b>'+esc(h.c.nome)+'</b><small>'+(MSGS.find(m=>m.k===h.k)||{n:h.k}).n+'</small></div><small>há '+timeAgo(h.ms)+'</small></div>').join('')+'</div>':'<div class="empty">Nenhuma mensagem enviada ainda.</div>')+'</section></div>'+
  '<section class="card" style="margin-top:18px"><h2>Como funciona</h2><p class="hint" style="margin:0">A fila se monta sozinha a partir da etapa, da data e do pagamento de cada cliente. Ao tocar em <b>Enviar</b>, o texto já vem preenchido com nome, data, valores e links. O WhatsApp abre com a conversa pronta e você só confirma o envio.</p></section>'}

/* ---- financeiro ---- */
function vFin(){const cs=[...S.clients].sort((a,b)=>(a.data||'9').localeCompare(b.data||'9')),T={total:0,entrada:0,rest:0,ex:0,exv:0,rec:0,owe:0};
  cs.forEach(c=>{const k=calc(c);T.total+=k.total;T.entrada+=k.entrada;T.rest+=k.restante;T.ex+=k.ex;T.exv+=k.extrasV;T.rec+=k.recebido;T.owe+=k.aReceber});
  return head('<button class="btn" data-act="csv" type="button">'+ico('dl')+'Exportar planilha</button>')+'<div class="kpis k4" style="margin-bottom:18px">'+kpi('Receita prevista','coin',brl0(T.total),cs.length+' clientes','var(--gold2)')+kpi('Recebido','check',brl0(T.rec),'dinheiro em caixa','var(--pine)')+kpi('A receber','bell',brl0(T.owe),'restantes em aberto','var(--red2)')+kpi('Fotos extras','photo',T.ex+' · '+brl0(T.exv),brl0(S.cfg.precoExtra)+' cada','var(--amber)')+'</div>'+
  (cs.length?'<div class="tw"><table><thead><tr><th>Cliente</th><th>Ensaio</th><th class="r">Extras</th><th class="r">Total</th><th class="r">Entrada</th><th class="r">Restante</th><th>Status</th></tr></thead><tbody>'+cs.map(c=>{const k=calc(c);return '<tr><td><b>'+esc(c.nome)+'</b></td><td>'+fmtDay(c.data)+'</td><td class="r">'+k.ex+' · '+brl0(k.extrasV)+'</td><td class="r">'+brl0(k.total)+'</td><td class="r">'+brl0(k.entrada)+'</td><td class="r">'+brl0(k.restante)+'</td><td>'+(k.restante===0?'<span class="pill ln" style="--st:var(--pine)">Quitado</span>':'<button class="btn sm '+(c.restantePago?'':'pri')+'" data-act="pay" data-id="'+c.id+'" type="button">'+(c.restantePago?'Desfazer recebimento':'Marcar recebido')+'</button>')+'</td></tr>'}).join('')+'</tbody><tfoot><tr><td colspan="2">Total</td><td class="r">'+T.ex+' · '+brl0(T.exv)+'</td><td class="r">'+brl0(T.total)+'</td><td class="r">'+brl0(T.entrada)+'</td><td class="r">'+brl0(T.rest)+'</td><td></td></tr></tfoot></table></div>':'<div class="card empty"><b>Sem lançamentos</b>Os valores aparecem quando você cadastrar clientes.</div>')}

/* ---- financeiro (ensaio e extras separados) ---- */
function vFin2(){const cs=[...S.clients].sort((a,b)=>(a.data||'9').localeCompare(b.data||'9')),T={total:0,entrada:0,pr:0,ex:0,exv:0,rec:0,owe:0};

  (cs.length?'<div class="tw"><table style="min-width:900px"><thead><tr><th>Cliente</th><th>Ensaio</th><th class="r">Entrada</th><th class="r">Restante do ensaio</th><th class="r">Fotos extras</th><th class="r">Total</th><th class="r">Falta receber</th></tr></thead><tbody>'+cs.map(c=>{const k=calc(c);return '<tr><td><b>'+esc(c.nome)+'</b></td><td>'+fmtDay(c.data)+'</td><td class="r">'+brl0(k.entrada)+'</td><td class="r">'+rb('payp',c,k.pacoteRest,k.pp)+'</td><td class="r">'+(k.ex?'<small>'+k.ex+' foto'+(k.ex>1?'s':'')+' · '+brl0(k.extrasV)+'</small><br>':'<small>sem extras</small>')+(k.ex?rb('paye',c,k.extrasRest,k.ep):'')+'</td><td class="r">'+brl0(k.total)+'</td><td class="r"><b class="'+(k.aReceber>0?'warn':'ok')+'">'+(k.aReceber>0?brl0(k.aReceber):'Quitado')+'</b></td></tr>'}).join('')+'</tbody><tfoot><tr><td colspan="2">Total</td><td class="r">'+brl0(T.entrada)+'</td><td class="r">'+brl0(T.pr)+'</td><td class="r">'+T.ex+' · '+brl0(T.exv)+'</td><td class="r">'+brl0(T.total)+'</td><td class="r">'+brl0(T.owe)+'</td></tr></tfoot></table></div>':'<div class="card empty"><b>Sem lançamentos</b>Os valores aparecem quando você cadastrar clientes.</div>')}

  const slotsFor=d=>{const taken=Object.fromEntries(S.clients.filter(x=>x.data===d&&x.id!==c.id&&x.horario).map(x=>[x.horario,x]));return S.cfg.horarios.map(h=>'<button type="button" class="slot'+(taken[h]?' taken':'')+'" data-act="pickslot" data-h="'+h+'" title="'+(taken[h]?'Ocupado: '+esc(taken[h].nome):'')+'">'+h+'</button>').join('')};

  '<div class="f2"><label class="field"><span>Nome *</span><input id="f-nome" value="'+esc(c.nome)+'" required></label><label class="field"><span>Telefone (WhatsApp)</span><input id="f-tel" inputmode="tel" value="'+esc(c.telefone)+'" placeholder="(11) 91234-5678"></label><label class="field" style="grid-column:1/-1"><span>E-mail</span><input id="f-email" type="email" value="'+esc(c.email)+'"></label></div>'+

/* ---- colar ficha preenchida ---- */
const pasteBtn='<button class="btn" data-act="paste" type="button">'+ico('copy')+'Colar ficha</button>';
const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function fichaKey(l){l=nrm(l);if(/e-?mail/.test(l))return 'email';if(/whats|telefone|celular|zap|fone|contato/.test(l))return 'telefone';if(/pessoas|participar/.test(l))return 'pessoas';if(/horario|hora/.test(l))return 'horario';if(/\bdata\b|dia escolhido/.test(l))return 'data';if(/nome/.test(l))return 'nome';if(/observa|pedido|tema|recado|detalhe/.test(l))return 'obs';return ''}
function parseData(v){const s=nrm(v),y0=new Date().getFullYear(),ok=(y,mo,d)=>{const dt=new Date(y,mo-1,d);return dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d?fmtISO(dt):''};
  let m=s.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{2,4}))?/);
  if(m){let y=m[3]?+m[3]:y0;if(y<100)y+=2000;return ok(y,+m[2],+m[1])}
  m=s.match(/(\d{1,2})\s*(?:o\s*)?(?:de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*(?:\s*(?:de\s*)?(\d{4}))?/);
  if(m)return ok(m[3]?+m[3]:y0,MES.indexOf(m[2])+1,+m[1]);
  return ''}
function parseHora(v){const s=nrm(v),m=s.match(/(\d{1,2})\s*(?:[:h]\s*(\d{2})?)?/);if(!m)return '';let h=+m[1];const mi=m[2]||'00';if(/tarde|noite/.test(s)&&h<12)h+=12;if(h>23||+mi>59)return '';return pad(h)+':'+mi}
function parseFicha(txt){const raw={};let cur=null;
  String(txt).split(/\r?\n/).forEach(line=>{const clean=line.replace(/^[^\p{L}\p{N}(]+/u,'').trim();if(!clean)return;
    if(clean===clean.toUpperCase()&&/\p{L}/u.test(clean)&&!clean.includes(':')){cur=null;return}
    const m=clean.match(/^([^:]{2,80}):\s*(.*)$/);
    if(m&&!/^\d{1,2}$/.test(m[1].trim())){const k=fichaKey(m[1]);if(k){cur=k;raw[k]=(raw[k]?raw[k]+'\n':'')+m[2].trim()}else cur=null;return}
    if(cur)raw[cur]=(raw[cur]?raw[cur]+'\n':'')+clean});
  const pre={};
  if(raw.nome)pre.nome=raw.nome.split('\n')[0].trim();
  if(raw.telefone&&raw.telefone.replace(/\D/g,'').length>=10)pre.telefone=fmtTel(raw.telefone);
  if(raw.email){const m=raw.email.match(/[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+/);if(m)pre.email=m[0]}
  if(raw.data){const d=parseData(raw.data);if(d)pre.data=d}
  if(raw.horario){const h=parseHora(raw.horario);if(h)pre.horario=h}
  const obs=[];if(raw.pessoas)obs.push('Pessoas: '+raw.pessoas.replace(/\n/g,' '));if(raw.obs)obs.push(raw.obs);if(obs.length)pre.obs=obs.join('\n');
  /* fichas sem nomes de campo: reconhece cada linha pelo tipo de conteúdo */
  const loose=!Object.keys(raw).length,rest=[];
  String(txt).split(/\r?\n/).map(l=>l.replace(/^[^\p{L}\p{N}(@+]+/u,'').trim()).filter(Boolean).forEach(l=>{
    const em=l.match(/[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+/);if(em){if(!pre.email)pre.email=em[0];return}
    const dg=l.replace(/\D/g,'');if(/^[\d\s()+.\-]+$/.test(l)&&dg.length>=10&&dg.length<=13){if(!pre.telefone)pre.telefone=fmtTel(l);return}
    if(l.length<=25){const n=nrm(l);
      if(/^(?:as\s*)?\d{1,2}\s*(?:h|hs|horas?|:)\s*\d{0,2}(?:\s*(?:h|hs|horas?))?(?:\s*da\s*(?:manha|tarde|noite))?$/.test(n)||/^\d{1,2}\s*da\s*(?:manha|tarde|noite)$/.test(n)){const h=parseHora(l);if(h){if(!pre.horario)pre.horario=h;return}}
      const d=parseData(l);if(d){if(!pre.data)pre.data=d;return}}
    if(loose)rest.push(l)});
  if(loose&&!pre.nome){const i=rest.findIndex(l=>/^[\p{L}][\p{L}\s'.\-]{2,}$/u.test(l)&&!/\b(?:mais|pessoas|adultos?|criancas?|filhos?|pets?)\b/.test(nrm(l))&&!/^www|\.com|\.br/i.test(l));if(i>=0)pre.nome=rest.splice(i,1)[0]}
  if(loose){const ob=rest.map(l=>/\b(?:mais|pessoas|adultos?|criancas?|filhos?|pets?)\b/.test(nrm(l))?'Pessoas: '+l:l);if(ob.length)pre.obs=ob.join('\n')}
  const nomes={nome:'nome',telefone:'telefone',email:'e-mail',data:'data',horario:'horário'};
  return {pre,found:Object.keys(pre).length,miss:Object.keys(nomes).filter(k=>!(k in pre)).map(k=>nomes[k])}}
function openPaste(){openModal('<div class="mhd"><h2>Colar ficha preenchida</h2><button class="btn sm ghost" data-act="closem" type="button">Fechar</button></div><p class="hint" style="margin:0 0 10px">Cole aqui a resposta do cliente. O app lê os campos pelo nome (Nome, WhatsApp, E-mail, Data, Horário, Observação) ou, se vier uma informação por linha, pelo tipo de conteúdo (telefone, e-mail, data, horário). Depois abre o cadastro já preenchido para você conferir e salvar.</p><textarea id="pf-t" rows="12" placeholder="Cole o texto da ficha aqui"></textarea><div class="warnbox" id="pf-w"></div><div class="sec phact" style="justify-content:flex-end"><button class="btn" data-act="closem" type="button">Cancelar</button><button class="btn pri" id="pf-ok" type="button">Preencher cadastro</button></div>',1);
  const t=$('#pf-t');t.focus();
  $('#pf-ok').onclick=()=>{const r=parseFicha(t.value);if(!r.found){$('#pf-w').textContent='Não encontrei campos na ficha. Confira se os nomes (Nome, WhatsApp, E-mail, Data, Horário) vieram no texto.';return}
    openClient(null,r.pre);toast(r.miss.length?'Não consegui ler: '+r.miss.join(', ')+'. Complete no cadastro.':'Ficha lida. Confira os dados e salve.',{ms:7000})}}
/* ---- resumo do dia, sino e avisos ---- */
function dia(){const t=todayISO(),tm=addDays(t,1),by=d=>S.clients.filter(c=>c.data===d).sort((a,b)=>(a.horario||'99').localeCompare(b.horario||'99'));
  const ativo=c=>c.data&&c.etapa!=='entregue'&&(ET[c.etapa]||ET.agendado).i>0,dl=c=>addDays(c.data,S.cfg.prazo);
  const hoje=by(t),amanha=by(tm);
  return {t,tm,hoje,amanha,atras:S.clients.filter(c=>ativo(c)&&dl(c)<t),venc:S.clients.filter(c=>ativo(c)&&dl(c)>=t&&dl(c)<=addDays(t,3)),pend:pendencias(),receberHoje:hoje.reduce((a,c)=>{const k=calc(c);return a+(k.pp?0:k.pacoteRest)},0)}}
const nowHM=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
function dayStrip(){const d=dia(),hm=nowHM(),nx=d.hoje.find(c=>c.horario&&c.horario>=hm),lem=d.amanha.filter(c=>(c.enviados||{}).lembrete).length;
  const tile=(l,n,s,al)=>'<button class="dtile'+(al?' al':'')+'" data-act="resumo" type="button"><span class="l">'+l+'</span><span class="n num">'+n+'</span><small>'+s+'</small></button>';
  return '<div class="daystrip">'+tile('Hoje',d.hoje.length+' ensaio'+(d.hoje.length===1?'':'s'),d.hoje.length?(nx?'Próximo: '+nx.horario+' · '+esc(firstName(nx.nome)):'Todos já aconteceram'):'Dia livre',0)+
   tile('Amanhã',d.amanha.length+' ensaio'+(d.amanha.length===1?'':'s'),d.amanha.length?lem+'/'+d.amanha.length+' lembretes enviados':'Dia livre',d.amanha.length>lem)+
   tile('A receber hoje',brl0(d.receberHoje),'restante dos ensaios de hoje',0)+'</div>'}
function updateBell(){const b=$('#bell');if(!b)return;const d=dia(),n=d.hoje.length+d.amanha.length+d.atras.length;b.className='bell'+(n?' has':'');b.hidden=S.tab!=='painel';b.innerHTML=ico('bell')+(n?'<span class="badge">'+n+'</span>':'');b.title='Resumo do dia'}
function openResumo(){const d=dia(),hm=nowHM(),now=new Date(),perm=('Notification' in window)?Notification.permission:'indisponivel';
  const nextId=(d.hoje.find(c=>c.horario&&c.horario>=hm)||{}).id;
  const item=(c,tom)=>{const e=c.enviados||{},past=!tom&&c.horario&&c.horario<hm;return '<div class="li rs'+(past?' past':'')+(!tom&&c.id===nextId?' next':'')+'"><b class="rt num">'+(c.horario||'--:--')+'</b><div class="m"><b>'+esc(c.nome)+'</b><small>'+(ET[c.etapa]||ET.agendado).n+(c.obs?' · '+esc(c.obs):'')+'</small></div>'+(tom?'<button class="btn sm wa" data-act="msg" data-id="'+c.id+'" data-key="lembrete" type="button">'+(e.lembrete?'Lembrete ✓':'Lembrete')+'</button>':'<button class="btn sm" data-act="edit" data-id="'+c.id+'" type="button" title="Abrir cadastro">'+ico('edit')+'</button>')+'</div>'};
  const line=(txt,val,tab,bad)=>'<button class="rline'+(bad?' bad':'')+'" data-act="go" data-tab="'+tab+'" type="button"><span>'+txt+'</span><b>'+val+'</b></button>';
  let att='';if(d.pend.length)att+=line('Mensagens na fila do WhatsApp',d.pend.length,'whatsapp');
  if(d.atras.length)att+=line('Entregas atrasadas: '+esc(d.atras.slice(0,3).map(c=>firstName(c.nome)).join(', '))+(d.atras.length>3?'…':''),d.atras.length,'pos-producao',1);
  if(d.venc.length)att+=line('Entregas que vencem em até 3 dias',d.venc.length,'pos-producao');
  if(d.receberHoje>0)att+=line('Restante dos ensaios de hoje a receber',brl0(d.receberHoje),'financeiro');
  const permTxt={granted:'Avisos do navegador ativados.',denied:'O navegador bloqueou os avisos. Libere nas permissões do site.',default:'Avisos do navegador ainda não ativados.',indisponivel:'Este navegador não oferece avisos do sistema.'}[perm]||'';
  openModal('<div class="mhd"><div><span class="lbl">Resumo do dia</span><h2>'+DIASL[now.getDay()][0].toUpperCase()+DIASL[now.getDay()].slice(1)+', '+fmtLong(d.t)+'</h2></div><button class="btn sm ghost" data-act="closem" type="button">Fechar</button></div>'+
   '<div class="rsec"><h3>Hoje <span class="pill" style="--st:var(--red2)">'+d.hoje.length+'</span></h3>'+(d.hoje.length?'<div class="list">'+d.hoje.map(c=>item(c,0)).join('')+'</div>':'<small>Nenhum ensaio hoje.</small>')+'</div>'+
   '<div class="rsec"><h3>Amanhã <span class="pill" style="--st:var(--gold)">'+d.amanha.length+'</span></h3>'+(d.amanha.length?'<div class="list">'+d.amanha.map(c=>item(c,1)).join('')+'</div>':'<small>Nenhum ensaio amanhã.</small>')+'</div>'+
   '<div class="rsec"><h3>Precisa de atenção</h3>'+(att||'<small>Tudo em dia ✨</small>')+'</div>'+
   '<div class="sec"><span class="lbl">Avisos</span><p class="hint" style="margin:0 0 10px">O app avisa na tela quando abre e 15 minutos antes de cada ensaio de hoje. '+permTxt+' Os avisos funcionam enquanto o app estiver aberto, mesmo em outra aba. Com o app fechado, não dá para enviar.</p>'+(perm==='granted'?'':'<button class="btn" data-act="enableNotif" type="button">'+ico('bell')+'Ativar avisos do navegador</button>')+'</div>',1)}
const fired=new Set();
function notify(t,b){try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}
function checkAlerts(){if(!S.ready)return;const now=new Date(),d=dia(),key='resumo-'+d.t;let seen=false;try{seen=localStorage.getItem(key)==='1'}catch(e){}
  if(now.getHours()>=7&&!seen&&!fired.has(key)&&(d.hoje.length||d.amanha.length)){fired.add(key);try{localStorage.setItem(key,'1')}catch(e){}
    const msg='Hoje: '+d.hoje.length+' ensaio(s). Amanhã: '+d.amanha.length+'.';toast(msg,{ms:9000,action:{label:'Ver resumo',fn:openResumo}});notify('Ensaio de Natal 2026',msg)}
  const mins=now.getHours()*60+now.getMinutes();
  d.hoje.forEach(c=>{if(!c.horario||c.etapa!=='agendado')return;const [h,m]=c.horario.split(':').map(Number),diff=h*60+m-mins,k='pre-'+c.id+d.t+c.horario;
    if(diff>=0&&diff<=15&&!fired.has(k)){fired.add(k);const msg='Ensaio com '+firstName(c.nome)+' às '+c.horario+(diff===0?' (agora)':' (em '+diff+' min)');toast(msg,{ms:9000,action:{label:'Ver resumo',fn:openResumo}});notify('Ensaio de Natal 2026',msg)}})}
/* ao chegar em Fotos escolhidas: pergunta quantas fotos o cliente escolheu */
function askExtras(id){const c=S.clients.find(x=>x.id===id);if(!c)return;const inc=S.cfg.fotosInclusas;
  openModal('<div class="mhd"><h2>Fotos escolhidas</h2></div><p class="hint" style="margin:0 0 12px">Quantas fotos '+esc(firstName(c.nome))+' escolheu no total? O ensaio inclui '+inc+'; as demais são extras de '+brl0(S.cfg.precoExtra)+' cada.</p><div class="step"><button type="button" data-act="tstep" data-n="-1">−</button><input id="ax-t" type="number" min="0" value="'+(inc+(parseInt(c.extras)||0))+'"><button type="button" data-act="tstep" data-n="1">+</button></div><div class="calc" id="ax-c" style="margin-top:12px"></div><div class="sec phact" style="justify-content:flex-end"><button class="btn" data-act="closem" type="button">Pular</button><button class="btn pri" id="ax-ok" type="button">Salvar</button></div>',1);
  const g=x=>$('#'+x),ex=()=>Math.max(0,(parseInt(g('ax-t').value)||0)-inc);
  const upd=()=>{const k=calc({...c,extras:ex()});g('ax-c').innerHTML='<div><small>Extras</small><b>'+k.ex+'</b></div><div><small>Valor dos extras</small><b>'+brl0(k.extrasV)+'</b></div><div><small>Total</small><b>'+brl0(k.total)+'</b></div><div><small>Restante</small><b>'+brl0(k.restante)+'</b></div>'};
  g('ax-t').oninput=upd;upd();g('ax-t').focus();g('ax-t').select();
  g('ax-ok').onclick=()=>{const cur=S.clients.find(x=>x.id===id)||c;saveClient({...cur,extras:ex()});closeModal();toast('Fotos extras salvas: '+ex(),{action:{label:'Enviar mensagem',fn:()=>openComposer(id,'recebido')}})}}
/* muda de Agendado para Ensaio feito quando passa o horário do ensaio */
function autoAdvance(){if(!S.ready)return;setTimeout(checkAlerts,0);const now=new Date(),t=fmtISO(now),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  S.clients.slice().forEach(c=>{if(c.etapa!=='agendado'||c.autoMovido||!c.data)return;
    const passou=c.data<t||(c.data===t&&c.horario&&c.horario<hm);
    if(passou){saveClient({...c,etapa:'realizado',etapaDesde:Date.now(),autoMovido:true});toast(firstName(c.nome)+' passou para "Ensaio feito" automaticamente.')}})}
/* ============ boot ============ */
async function boot(){route();
  const cl=window.claude;let db=null;
  try{if(cl&&cl.use){[db,USER,DL]=await Promise.all([cl.use('db').catch(()=>null),cl.use('user').catch(()=>null),cl.use('downloads').catch(()=>null)])}}catch(e){}
  try{if(USER&&typeof USER.canEdit==='function'&&USER.canEdit()===false&&db){document.body.insertAdjacentHTML('beforeend','<div class="lock"><div class="empty"><span class="av" style="width:64px;height:64px">'+ico('lock')+'</span><b>Acesso restrito aos fotógrafos</b><span>Peça ao responsável pelo ensaio para liberar acesso de edição.</span></div></div>');return}}catch(e){}
  if(db){DB=db;S.mode='db';let got=0;
    const done=()=>{if(++got>=1&&!S.ready){S.ready=true;render()}};
    db.collection('clientes').onSnapshot(s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()}));if(!S.ready){S.ready=true;render()}else softRender();autoAdvance()},e=>{console.error(e);S.ready=true;render()});
    db.doc('config/main').onSnapshot(s=>{if(s.exists){S.cfg=mergeCfg(s.data())}if(S.ready)softRender()},e=>console.error(e));
    setTimeout(()=>{if(!S.ready){S.ready=true;render()}},4000);
  }else{const d=lsLoad();if(d){S.clients=d.clients||[];S.cfg=mergeCfg(d.cfg)}S.ready=true;render();autoAdvance()}
}
boot();setInterval(autoAdvance,60000);setInterval(checkAlerts,30000);
})();
